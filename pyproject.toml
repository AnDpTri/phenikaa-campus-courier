[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phenikaa-courier"
version = "0.1.0"
description = "Modular solver for Phenikaa Campus Courier 2026"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
solver = [
    "joblib>=1.5,<2",
    "numpy>=2.0,<3",
    "scikit-learn>=1.7,<2",
]
cv = [
    "numpy>=2.0,<3",
    "opencv-python>=4.10",
    "pillow>=10",
]

[tool.setuptools.packages.find]
where = ["src"]
